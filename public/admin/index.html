<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Content Manager — Fathi Mohamed</title>
    <!-- Explicit absolute path so config.yml always resolves correctly,
         regardless of whether the browser shows /admin or /admin/ -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!-- Decap CMS admin UI, loaded from CDN — no build step needed. -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Live preview panes so editing content shows roughly what it will
      // look like on the real site, instead of a bare list of form fields.
      var h = window.h
      var createClass = window.createClass

      CMS.registerPreviewStyle('/admin/preview.css')

      var ProjectsPreview = createClass({
        render: function () {
          var entry = this.props.entry
          var projects = entry.getIn(['data', 'projects'])
          if (!projects) return h('div', {}, 'No projects yet.')

          return h(
            'div',
            { className: 'preview-grid' },
            projects
              .map(function (project, i) {
                var images = project.get('images')
                var firstImage =
                  images && images.size > 0 ? images.get(0).get('src') : ''
                var tools = project.get('tools')

                return h(
                  'div',
                  { className: 'preview-card', key: i },
                  h('img', { className: 'preview-card-img', src: firstImage }),
                  h(
                    'div',
                    { className: 'preview-card-body' },
                    h(
                      'span',
                      { className: 'preview-card-category' },
                      project.get('categoryLabel')
                    ),
                    h('h3', { className: 'preview-card-title' }, project.get('title')),
                    h('p', { className: 'preview-card-desc' }, project.get('description')),
                    h(
                      'div',
                      { className: 'preview-card-tools' },
                      tools
                        ? tools
                            .map(function (tool, ti) {
                              return h(
                                'span',
                                { className: 'preview-tool-tag', key: ti },
                                tool
                              )
                            })
                            .toArray()
                        : null
                    )
                  )
                )
              })
              .toArray()
          )
        },
      })

      var TestimonialsPreview = createClass({
        render: function () {
          var entry = this.props.entry
          var testimonials = entry.getIn(['data', 'testimonials'])
          if (!testimonials) return h('div', {}, 'No testimonials yet.')

          return h(
            'div',
            {},
            testimonials
              .map(function (t, i) {
                return h(
                  'div',
                  { className: 'preview-testimonial', key: i },
                  h('p', { className: 'preview-testimonial-quote' }, '“' + t.get('quote') + '”'),
                  h('span', { className: 'preview-testimonial-name' }, '— ' + t.get('name'))
                )
              })
              .toArray()
          )
        },
      })

      var ServicesPreview = createClass({
        render: function () {
          var entry = this.props.entry
          var services = entry.getIn(['data', 'services'])
          if (!services) return h('div', {}, 'No services yet.')

          return h(
            'div',
            { className: 'preview-grid' },
            services
              .map(function (service, i) {
                return h(
                  'div',
                  { className: 'preview-card', key: i },
                  h(
                    'div',
                    { className: 'preview-card-body' },
                    h('h3', { className: 'preview-card-title' }, service.get('title')),
                    h('p', { className: 'preview-card-desc' }, service.get('description'))
                  )
                )
              })
              .toArray()
          )
        },
      })

      var SitePreview = createClass({
        render: function () {
          var entry = this.props.entry
          var hero = entry.getIn(['data', 'hero'])
          var about = entry.getIn(['data', 'about'])
          if (!hero) return h('div', {}, 'No content yet.')

          return h(
            'div',
            { className: 'site-preview' },
            h(
              'div',
              { className: 'site-preview-hero' },
              hero.get('availableForWork')
                ? h('span', { className: 'preview-card-category' }, hero.get('availabilityText'))
                : null,
              h('h1', { className: 'site-preview-title' }, 'Fathi Mohamed'),
              h('h2', { className: 'site-preview-subtitle' }, hero.get('subtitle')),
              h('p', { className: 'preview-card-desc' }, hero.get('description'))
            ),
            about
              ? h(
                  'div',
                  { className: 'site-preview-about' },
                  h('h3', { className: 'preview-card-title' }, about.get('title')),
                  h('p', { className: 'preview-card-desc' }, about.get('bio1')),
                  h('p', { className: 'preview-card-desc' }, about.get('bio2'))
                )
              : null
          )
        },
      })

      CMS.registerPreviewTemplate('projects', ProjectsPreview)
      CMS.registerPreviewTemplate('testimonials', TestimonialsPreview)
      CMS.registerPreviewTemplate('services', ServicesPreview)
      CMS.registerPreviewTemplate('site', SitePreview)
    </script>
  </body>
</html>
